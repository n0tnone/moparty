  <style>
    @keyframes beam {
      0%   { transform: translateX(-210px); }
      45%  { transform: translateX(210px); }
      100% { transform: translateX(210px); }
    }
    @keyframes beamOpacity {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      38%  { opacity: 1; }
      45%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes rec {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
    .beam-move { animation: beam 5s cubic-bezier(0.4,0,0.6,1) infinite; }
    .beam-fade { animation: beamOpacity 5s ease-in-out infinite; }
    .rec       { animation: rec 1.1s ease-in-out infinite; }
  </style>

